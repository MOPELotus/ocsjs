name: Sync upstream and publish patched OCS

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - "4.0"
    paths:
      - ".github/workflows/sync-and-publish-patched.yml"
      - "packages/core/src/core/answer-wrapper/answer.wrapper.handler.ts"
      - "packages/scripts/src/projects/cx.ts"
      - "packages/scripts/src/utils/work.ts"
      - "response_service/**"
      - "scripts/build-core.js"

permissions:
  contents: write

concurrency:
  group: patched-ocs-publish
  cancel-in-progress: false

jobs:
  sync-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: "4.0"
          fetch-depth: 0

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ocsjs/ocsjs.git 2>/dev/null || \
            git remote set-url upstream https://github.com/ocsjs/ocsjs.git
          git fetch upstream 4.0
          if ! git merge-base --is-ancestor upstream/4.0 HEAD; then
            git merge --no-edit upstream/4.0
            git push origin HEAD:4.0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install OCS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build patched all-domain userscript
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          COMMIT_EPOCH="$(git show -s --format=%ct HEAD)"
          export OCS_BUILD_VERSION="${BASE_VERSION}.${COMMIT_EPOCH}"
          export OCS_FORK_RAW_ROOT="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist"
          pnpm build
          test -s dist/ocs.common.user.js
          grep -F "@updateURL" dist/ocs.common.user.js
          grep -F "${OCS_BUILD_VERSION}" dist/ocs.common.user.js

      - name: Test Responses service
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: response_service/requirements.txt

      - name: Run Responses service tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r response_service/requirements.txt
          python -m unittest response_service.tests.test_engine -v

      - name: Prepare update files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cp dist/ocs.common.user.js publish/ocs.common.user.js
          sed -n '1,/==\/UserScript==/p' dist/ocs.common.user.js > publish/ocs.common.meta.js
          printf '{"source_commit":"%s","built_at":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" > publish/version.json

      - name: Publish dist branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish
          git init
          git checkout -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocs.common.user.js ocs.common.meta.js version.json
          git commit -m "Publish patched OCS from ${GITHUB_SHA}"
          git remote add origin "https://github-actions:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist
